services:
  mongo:
    image: mongo:7
    container_name: fixy_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-fixy}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-fixy_pw}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-fixy_craft}

  neo4j:
    image: neo4j:5-community
    container_name: fixy_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # 브라우저
      - "7687:7687"   # 볼트(Bolt)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j_pw}
      NEO4J_PLUGINS: '["apoc"]'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fixy_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - neo4j
    environment:
      MONGO_URL: mongodb://${MONGO_USER:-fixy}:${MONGO_PASSWORD:-fixy_pw}@mongo:27017/${MONGO_DB:-fixy_craft}?authSource=admin
      NEO4J_URL: bolt://${NEO4J_USER:-neo4j}:${NEO4J_PASSWORD:-neo4j_pw}@neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_pw}
      FIXY_UPLOAD_DIR: /data/uploads
      FIXY_CORS_ORIGINS: http://localhost:3000
    volumes:
      - fixy_uploads:/data/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fixy_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

volumes:
  mongo_data:
  neo4j_data:
  neo4j_logs:
  fixy_uploads:
