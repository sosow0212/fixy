[project]
name = "fixy-craft-backend"
version = "0.1.0"
description = "fixy-craft — 팔란티어형 온톨로지 플랫폼 백엔드 (FastAPI + MongoDB + Neo4j)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "motor>=3.6",
    "beanie>=1.27",
    "neo4j>=5.25",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mongomock-motor>=0.0.34",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
